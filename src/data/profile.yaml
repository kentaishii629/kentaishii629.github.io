# bio: 空行で段落を分ける。段落内の改行は、日本語はそのまま連結、英語は空白で連結される。
bio:
  ja: |-
    都市空間における人の移動・滞在行動を対象に、観測データからその構造を推定する研究を行っています。
    人流データや交通ネットワークを題材に、行動モデルの推定と因果推論、機械学習の応用に取り組んでいます。
    研究成果を都市計画や交通施策の評価に活かすことを目指しています。
  en: |-
    I study how people move and stay in urban space, estimating the underlying structure from observational data.
    My work spans behavioral model estimation, causal inference, and machine-learning applications
    on pedestrian-flow data and transportation networks, with the aim of informing urban and transport policy evaluation.
research:
  - title: { ja: 人流分析, en: Pedestrian Flow Analysis }
    summary:
      ja: 位置情報や観測カウントから、都市内の歩行者の流れと滞留の構造を推定する。
      en: Estimating the structure of pedestrian flows and dwell behavior in cities from location data and observed counts.
  - title: { ja: 交通ネットワークモデリング, en: Transportation Network Modeling }
    summary:
      ja: 道路・公共交通ネットワーク上の経路選択と配分を記述するモデルの構築と推定。
      en: Building and estimating models of route choice and assignment on road and transit networks.
  - title: { ja: 行動パラメータ推定, en: Behavioral Parameter Estimation }
    summary:
      ja: 離散選択モデルなどを用いて、移動行動の背後にある選好パラメータを統計的に推定する。
      en: Statistically estimating preference parameters behind travel behavior using discrete choice and related models.
  - title: { ja: 因果推論, en: Causal Inference }
    summary:
      ja: 観測データから交通・都市施策の効果を識別するための因果推論手法の適用と拡張。
      en: Applying and extending causal inference methods to identify the effects of transport and urban interventions from observational data.
  - title: { ja: 交通への機械学習応用, en: Machine Learning for Transportation }
    summary:
      ja: 需要予測や行動分類など、交通分野の問題に対する機械学習手法の応用と解釈性の検討。
      en: Applying machine learning to transportation problems such as demand forecasting and behavior classification, with attention to interpretability.
